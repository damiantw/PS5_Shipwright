# Builds PPSA99320.zip for the PS5.
#
# - Push a tag equal to ps5/sce_sys/param.json's contentVersion (e.g. 01.000.000): build,
#   check, and publish a GitHub release with the zip and its sha256.
# - Run it by hand (Actions > release > Run workflow): the same build and checks, artifacts
#   only, nothing published.
#
# Either way catalog/PPSA99320.json, filled in with this build's sha256, is an artifact. The
# catalog submission stays a manual step: nothing here opens a pull request anywhere.
name: release

on:
  push:
    tags: ['[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]']
  workflow_dispatch:

permissions:
  contents: read

env:
  # the console toolchain this port builds with (see ps5/tools/setup-sdk.sh, PS5_Vulkan's build-radv.sh)
  PAYLOAD_SDK_REV: b5efad528e0ac1b8289f39d72a0e890ff68ff0a6
  PS5_VULKAN_REV: 252bf912a745e3566a93b69b098bdc8ec4048837
  PS5_MESA_REV: 47e9eb61ee7e1112194557e1e047178562827bc6

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 240
    steps:
      - name: Host tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            git ca-certificates curl wget make file unzip zip xz-utils python3 python3-pip python3-mako python3-yaml \
            python3-packaging clang-18 lld-18 llvm-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev \
            libclc-18-dev libllvmspirvlib-18-dev spirv-tools glslang-tools bison flex pkg-config \
            cmake ninja-build ffmpeg imagemagick zlib1g-dev libzstd-dev libzip-dev rsync patch libclang-rt-18-dev
          pip3 install --break-system-packages -q "meson==1.7.0"
          ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          for t in llvm-ar llvm-ranlib llvm-objcopy llvm-strip llvm-nm llvm-config; do ln -sf /usr/bin/$t-18 /usr/local/bin/$t; done
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          path: PS5_Shipwright
          submodules: recursive

      - name: Tag matches contentVersion
        working-directory: PS5_Shipwright
        run: |
          version=$(python3 -c 'import json; print(json.load(open("ps5/sce_sys/param.json"))["contentVersion"])')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME is not contentVersion $version" >&2; exit 1
          fi

      - name: Toolchain cache
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            PS5_Shipwright/.deps
            PS5_Vulkan/.deps/native/radv-release
            PS5_Vulkan/.deps/native/zlib
            PS5_Vulkan/.deps/native/ps5-payload-sdk
          key: ps5-toolchain-${{ env.PAYLOAD_SDK_REV }}-${{ env.PS5_VULKAN_REV }}-${{ env.PS5_MESA_REV }}-${{ hashFiles('PS5_Shipwright/ps5/tools/setup-*.sh', 'PS5_Shipwright/ps5/patches/sdl.patch') }}
          restore-keys: ps5-toolchain-${{ env.PAYLOAD_SDK_REV }}-${{ env.PS5_VULKAN_REV }}-${{ env.PS5_MESA_REV }}-

      - uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_PayloadSDK
          ref: ${{ env.PAYLOAD_SDK_REV }}
          path: PS5_PayloadSDK
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_Vulkan
          ref: ${{ env.PS5_VULKAN_REV }}
          path: PS5_Vulkan
          fetch-depth: 0

      - name: PS5_Vulkan native deps and host tool
        run: |
          # zlib.net can refuse CI runners; the same tarball from zlib's GitHub release
          # (the setup script still checks its sha256)
          mkdir -p PS5_Vulkan/.deps/native/zlib
          [ -f PS5_Vulkan/.deps/native/zlib/zlib-1.3.2.tar.gz ] ||
            curl -fsSL -o PS5_Vulkan/.deps/native/zlib/zlib-1.3.2.tar.gz \
              https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
          bash PS5_Vulkan/tools/setup-native-dependencies.sh
          zroot=PS5_Vulkan/.deps/native/zlib/root
          native=PS5_Vulkan/tooling/native
          mkdir -p PS5_Vulkan/build/host
          clang++ -std=c++20 -O2 -I "$zroot/usr/include" \
            "$native/native_app_builder.cpp" "$native/self_container.cpp" \
            "$native/elf_object.cpp" "$native/sce_module_writer.cpp" \
            "$(find "$zroot" -type f -name libz.a -print -quit)" -o PS5_Vulkan/build/host/ps5-native-tool

      - name: RADV (cached by revision)
        if: hashFiles('PS5_Vulkan/.deps/native/radv-release/PROVENANCE.txt') == ''
        run: |
          git clone --filter=blob:none https://github.com/mihawk-99/PS5_Mesa.git PS5_Mesa
          git -C PS5_Mesa checkout -q "$PS5_MESA_REV"
          bash PS5_Vulkan/tools/build-radv.sh release

      # saved explicitly (not in the post step) so a later failure does not discard a 40-minute RADV build
      - name: Save toolchain cache (RADV)
        if: steps.toolchain.outputs.cache-matched-key == '' && hashFiles('PS5_Vulkan/.deps/native/radv-release/PROVENANCE.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            PS5_Shipwright/.deps
            PS5_Vulkan/.deps/native/radv-release
            PS5_Vulkan/.deps/native/zlib
            PS5_Vulkan/.deps/native/ps5-payload-sdk
          key: ps5-toolchain-${{ env.PAYLOAD_SDK_REV }}-${{ env.PS5_VULKAN_REV }}-${{ env.PS5_MESA_REV }}-${{ hashFiles('PS5_Shipwright/ps5/tools/setup-*.sh', 'PS5_Shipwright/ps5/patches/sdl.patch') }}-radv-${{ github.run_id }}

      - name: libc.prx (PS5_Vulkan clean-room runtime, checksum-verified)
        run: |
          [ -f PS5_Vulkan/runtime/libc.prx ] || bash PS5_Vulkan/tools/rebuild-libc.sh
          (cd PS5_Vulkan/runtime && sha256sum --check --strict libc.prx.sha256)

      - name: Build
        working-directory: PS5_Shipwright
        run: |
          bash ps5/tools/build.sh
          bash ps5/tools/assets.sh
          bash ps5/tools/release.sh --no-build | tee release.log

      - name: No ROM or game archive in the zip
        working-directory: PS5_Shipwright
        run: |
          python3 - <<'PY'
          import re, zipfile, io
          bad = re.compile(r'\.(z64|n64|v64|rom|otr)$|(^|/)oot(-mq)?\.o2r$|(^|/)mq\.o2r$', re.I)
          z = zipfile.ZipFile("dist/PPSA99320.zip")
          names = z.namelist()
          inner = zipfile.ZipFile(io.BytesIO(z.read("PPSA99320/assets.zip"))).namelist()
          hits = [n for n in names + inner if bad.search(n)]
          assert not hits, f"game data in the release: {hits[:5]}"
          print(f"ok: {len(names)} entries, {len(inner)} in assets.zip, no ROM or oot*.o2r")
          PY

      - name: sha256 and catalog record
        working-directory: PS5_Shipwright
        run: |
          mkdir -p out
          cp dist/PPSA99320.zip out/
          (cd out && sha256sum PPSA99320.zip > PPSA99320.zip.sha256)
          sha=$(cut -d' ' -f1 out/PPSA99320.zip.sha256)
          python3 - "$sha" "$VERSION" <<'PY'
          import json, sys
          sha, version = sys.argv[1:3]
          rec = json.load(open("catalog/PPSA99320.json"))
          base = "https://github.com/damiantw/PS5_Shipwright"
          rec.update(version=version, sha256=sha,
                     artifact_url=f"{base}/releases/download/{version}/PPSA99320.zip",
                     icon_url=f"https://raw.githubusercontent.com/damiantw/PS5_Shipwright/{version}/ps5/sce_sys/icon0.png")
          json.dump(rec, open("out/PPSA99320.json", "w"), indent=2)
          open("out/PPSA99320.json", "a").write("\n")
          PY
          cat out/PPSA99320.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PPSA99320-${{ env.VERSION }}
          path: |
            PS5_Shipwright/out/PPSA99320.zip
            PS5_Shipwright/out/PPSA99320.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: catalog-PPSA99320-${{ env.VERSION }}
          path: PS5_Shipwright/out/PPSA99320.json

  publish:
    # only for a pushed version tag; a manual run never publishes
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PPSA99320-${{ github.ref_name }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" PPSA99320.zip PPSA99320.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Ship of Harkinian for PS5 $GITHUB_REF_NAME" \
            --notes "Install: download PPSA99320.zip, unzip it, copy the PPSA99320 folder to /data/homebrew/ on the console. sha256: $(cut -d' ' -f1 PPSA99320.zip.sha256)"
