# Hyrule Field, adult by day: after the load settles, 10 s standing and 6 s running after a warm-up lap
# with no frame over 20 ms (screenshots only outside the measured windows) (the 60 fps budget is 16.7 ms). Ring peaks are recorded.
steps:
  - require_state: [play]
  - warp: {entrance: HYRULE_FIELD_PAST_BRIDGE_SPAWN, age: adult, time: noon, max_seconds: 10}
  - assert_state: {scene: 0x51, loaded: true}
  - sleep: 3
  - screenshot: field
  - perf_reset: {}
  - sleep: 10
  - assert_perf: {max_ms: 20}
  # warm-up lap over the same ground first: the first sight of new geometry compiles
  # Vulkan pipelines (cached in /data/soh for later launches), which this test does not measure
  - stick: {x: 0, y: -80, frames: 120}
  - stick: {x: 0, y: 80, frames: 120}
  - perf_reset: {}
  - stick: {x: 0, y: -80, frames: 120}  # 6 s, stays in the field (running the other way reaches Market Entrance)
  - assert_perf: {max_ms: 20}
  - assert_state: {scene: 0x51, loaded: true}
  - screenshot: field-ran           # after the measurement: a screenshot's readback stalls a frame
